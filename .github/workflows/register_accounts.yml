name: Register Oiioii Accounts

on:
  schedule:
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of accounts to register'
        default: '10'
        required: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        batch-id: [1, 2, 3]
      max-parallel: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests opencv-python-headless numpy
          playwright install chromium

      - name: Install system deps
        run: |
          playwright install-deps chromium

      - name: Register accounts
        env:
          SERVER_URL: ${{ secrets.SERVER_URL || 'http://122.51.205.94' }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        run: |
          COUNT_INPUT="${{ github.event.inputs.count || '10' }}"
          PER_JOB=$(( (COUNT_INPUT + 2) / 3 ))
          python "04_OiioiiPool账号池/register_oiioii.py" --count $PER_JOB

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-result-${{ strategy.job-index }}
          path: register_result.json
          retention-days: 7
