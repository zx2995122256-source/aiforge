name: 注册 Oiioii 账号并推送到服务器

on:
  schedule:
    # 每天 8:00、14:00、20:00 自动注册（北京时间 = UTC+8 所以要减8）
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '注册数量'
        default: '10'
        required: false
      mode:
        description: '模式: batch(批量) / continuous(连续)'
        default: 'batch'
        required: false
      target:
        description: '连续模式目标数量'
        default: '50'
        required: false

env:
  SERVER_URL: ${{ secrets.SERVER_URL || 'http://122.51.205.94' }}

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        # 并行跑 3 个 job，每个注册不同的数量
        # 3 × 5 = 15 个/次
        batch-id: [1, 2, 3]
      max-parallel: 3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests opencv-python-headless numpy
          playwright install chromium

      - name: 安装系统依赖（Playwright 需要）
        run: |
          playwright install-deps chromium

      - name: 注册账号
        env:
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        run: |
          COUNT_INPUT="${{ github.event.inputs.count || '10' }}"
          MODE_INPUT="${{ github.event.inputs.mode || 'batch' }}"
          TARGET_INPUT="${{ github.event.inputs.target || '50' }}"

          # 3个并行job，每组注册 count/3 个
          PER_JOB=$(( (COUNT_INPUT + 2) / 3 ))
          if [ "$MODE_INPUT" = "continuous" ]; then
            python 04_OiioiiPool账号池/register_oiioii.py \
              --continuous --target $TARGET_INPUT
          else
            python 04_OiioiiPool账号池/register_oiioii.py \
              --count $PER_JOB
          fi

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-result-${{ strategy.job-index }}
          path: register_result.json
          retention-days: 7